<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Media Hub</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.png" type="image/png">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #222;
        }

        main {
            max-width: 1000px;
            margin: auto;
            background-color: white;
            padding: 30px;
        }

        h1 {
            font-family: "Poppins", sans-serif;
            text-align: center;
        }

        section {
            margin-bottom: 40px;
        }

        iframe,
        video {
            width: 100%;
            max-width: 800px;
            border: none;
        }

        video {
            height: auto;
        }

        audio {
            width: 100%;
            max-width: 600px;
        }

        embed {
            width: 100%;
            height: 600px;
        }
    </style>
</head>

<body>

    <main>

        <header>
            <h1>My Media Hub</h1>
            <p>Welcome to my multimedia webpage.</p>
        </header>

        <!-- YouTube Video -->
        <section>
            <h2>YouTube Video</h2>

            <iframe width="560" height="315" src="https://www.youtube.com/embed/aqz-KE-bpKQ"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </section>

        <!-- Local Video -->
        <section>
            <h2>Local Video</h2>

            <video controls width="640">
                <source src="assets/video.mp4" type="video/mp4">
                <source src="assets/video.webm" type="video/webm">

                Your browser does not support the video tag.
            </video>
        </section>

        <!-- Audio -->
        <section>
            <h2>Audio Clip</h2>

            <audio controls>
                <source src="assets/audio.mp3" type="audio/mpeg">

                Your browser does not support the audio element.
            </audio>
        </section>

        <!-- Google Map -->
        <section>
            <h2>PCPS College Location</h2>

            <iframe src="https://www.google.com/maps?q=PCPS%20College%20Kupondole%20Lalitpur&output=embed" width="600"
                height="450" loading="lazy" title="PCPS College Google Map">
            </iframe>
        </section>

        <!-- External Webpage -->
        <section>
            <h2>External Webpage</h2>

            <iframe src="https://www.w3schools.com/html/" width="800" height="500" title="External HTML webpage">
            </iframe>
        </section>

        <!-- PDF -->
        <section>
            <h2>Embedded PDF</h2>

            <embed src="assets/sample.pdf" type="application/pdf">
        </section>

        <footer>
            <p>&copy; 2026 My Media Hub</p>
        </footer>

    </main>

</body>

</html>
