<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marshal Ram</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <label for="interest">Interest:</label>
        <input type="checkbox" id="tech" name="interest" value="technology">
        <label for="tech">Technology</label>
        <input type="checkbox" id="science" name="interest" value="science">
        <label for="science">Science</label>
        <input type="checkbox" id="art" name="interest" value="art">
        <label for="art">Art</label><br><br>

        <label for="course">Course:</label>
        <select id="course" name="course">
            <option value="">Select a course</option>
            <option value="bsc">BSc(Hons) Software Engineering</option>
            <option value="msc">MSc Computer Science</option>
            <option value="phd">PhD in Computer Science</option>
        </select><br><br>

        <label for="about">About Yourself:</label><br>
        <textarea id="about" name="about" rows="4" cols="50" placeholder="Tell us about yourself..."></textarea><br><br>

        <input type="submit" value="Register">
    </form>

</body>

</html>
